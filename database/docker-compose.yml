# Rögzített projektnév: így a konténer- és volume-nevek nem függnek attól, melyik mappából indul a compose.
name: finex

services:
  postgres:
    image: postgres:15
    container_name: finex-postgres
    environment:
      POSTGRES_DB: finex
      POSTGRES_USER: finex
      POSTGRES_PASSWORD: finex123
    ports:
      - "5432:5432"
    volumes:
      # Új, üres volume: a sémát és a demóadatokat a backend Flyway-migrációi hozzák létre az első induláskor.
      # A korábbi, Hibernate által létrehozott adatbázis a "finex_finex-db-data" volume-ban érintetlenül megmaradt.
      - finex-pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  finex-pgdata:
