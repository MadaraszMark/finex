# Rögzített projektnév: a konténer- és volume-nevek nem függnek az indítási mappától
name: finex

services:
  postgres:
    image: postgres:15
    container_name: finex-postgres
    environment:
      POSTGRES_DB: finex
      POSTGRES_USER: finex
      POSTGRES_PASSWORD: finex123
    ports:
      # Csak erről a gépről érhető el (a helyi hálózat felől nem), mert a jelszó a repóban van
      - "127.0.0.1:5432:5432"
    volumes:
      # A sémát és a demóadatokat a backend Flyway-migrációi hozzák létre az első induláskor
      - finex-pgdata:/var/lib/postgresql/data
    # A gyökér compose-ban a backend megvárja, amíg az adatbázis kapcsolatot fogad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finex -d finex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

volumes:
  finex-pgdata:
