# FineX frontend Dockerben: React build, /api proxy a backendhez és biztonsági fejlécek
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Az nginx verziója ne látsszon a válaszokban
    server_tokens off;

    # Egy kérés legfeljebb ekkora lehet (a backend is ellenőrzi)
    client_max_body_size 64k;

    # Biztonsági fejlécek; a stílusnál az animációk inline style-ja miatt kell az 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Előtag nélkül megy a backendnek; az X-Forwarded-For felülírva, hogy a kliens ne hamisíthassa
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # A buildelt fájlok neve tartalmazza a tartalom hash-ét, így sokáig gyorsítótárazhatók
    location /assets/ {
        expires 1y;
    }

    # Egyoldalas alkalmazás: minden ismeretlen útvonalat a React router kezel
    location / {
        try_files $uri /index.html;
    }
}
