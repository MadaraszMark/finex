spring.application.name=finex

spring.datasource.url=${FINEX_DB_URL:jdbc:postgresql://localhost:5432/finex}
spring.datasource.username=${FINEX_DB_USERNAME:finex}
spring.datasource.password=${FINEX_DB_PASSWORD:finex123}
spring.datasource.driver-class-name=org.postgresql.Driver

# A sémát a Flyway kezeli (db/migration), a Hibernate csak ellenőrzi, hogy az entitások egyeznek-e vele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${FINEX_SHOW_SQL:false}
spring.jpa.open-in-view=false

# db/demo: demóadatok fejlesztéshez és bemutatóhoz (a tesztek és a prod profil nélküle futnak)
spring.flyway.locations=classpath:db/migration,classpath:db/demo

server.port=8080

# Csak proxy mögött kapcsold be, különben az X-Forwarded-For hamisításával megkerülhető az IP-limit
server.forward-headers-strategy=${FINEX_FORWARD_HEADERS_STRATEGY:none}

spring.devtools.restart.enabled=false

spring.data.web.pageable.max-page-size=100
# Stabil { content, page } JSON (az @EnableSpringDataWebSupport kiiktatná a max-page-size-t)
spring.data.web.pageable.serialization-mode=via-dto

# Swagger UI és OpenAPI leírás (fejlesztéshez és bemutatóhoz; a prod profil kikapcsolja)
springdoc.api-docs.enabled=${FINEX_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${FINEX_SWAGGER_ENABLED:true}

# A JWT-kulcs csak környezeti változóból jön (min. 32 bájt), nélküle indításonként véletlen kulcs
auth.jwt.secret=${FINEX_JWT_SECRET:}
auth.jwt.expiration-ms=3600000

# Üzleti szabályok
finex.transfer-daily-limit=5000000
finex.card-default-daily-limit=200000
finex.card-default-daily-limit-foreign=1000
finex.card-max-daily-limit=5000000
finex.savings-interest-rate=3.50
finex.max-accounts-per-user=5
finex.max-savings-per-user=10
finex.max-standing-orders-per-user=20
finex.max-beneficiaries-per-user=50
finex.login-max-failed-attempts=5
finex.login-max-failed-attempts-per-account=20
finex.login-max-failed-attempts-per-ip=20
finex.login-lock-minutes=15
finex.rate-limit-login-per-minute=10
finex.rate-limit-register-per-hour=10
finex.cors-allowed-origins=http://localhost:5173

# Devizaárfolyamok (demó, rögzített): 1 egység = ennyi forint
finex.exchange-rates.HUF=1
finex.exchange-rates.EUR=395.00
finex.exchange-rates.USD=362.00
